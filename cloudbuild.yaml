steps:
  # slack deployment status (started)
  - name: "gcr.io/cloud-builders/curl"
    args:
      [
        "-X",
        "POST",
        "-H",
        "Content-type: application/json",
        "--data",
        '{"text":"`gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME$TAG_NAME` build started!"}',
        "${_WEBHOOK_URL}",
      ]

  # pull docker image for cache
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME || exit 0

  # build docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME",
        "--cache-from",
        "gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME",
        "--build-arg",
        "NGINX_VERSION=$NGINX_VERSION",
        "--build-arg",
        "PAGESPEED_VERSION=$PAGESPEED_VERSION",
        "--build-arg",
        "LIBPNG_VERSION=$LIBPNG_VERSION",
        ".",
      ]
  # slack deployment status (completed)
  - name: "gcr.io/cloud-builders/curl"
    args:
      [
        "-X",
        "POST",
        "-H",
        "Content-type: application/json",
        "--data",
        '{"text":"`gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME$TAG_NAME` build completed successfully!"}',
        "${_WEBHOOK_URL}",
      ]
  # slack deployment status (failed)
  - name: "gcr.io/cloud-builders/curl"
    args:
      [
        "-X",
        "POST",
        "-H",
        "Content-type: application/json",
        "--data",
        '{"text":"`gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME$TAG_NAME` build failed!"}',
        "${_WEBHOOK_URL}",
      ]
    id: slack-fail
    waitFor: ["build-docker-image"]
    status: ["FAILURE"]
    
  # store artifact
  images: ["gcr.io/$PROJECT_ID/$_IMAGE:$BRANCH_NAME"]


# arguments
substitutions:
  _IMAGE: docker_image_name # docker image name
  _WEBHOOK_URL: https://hooks.slack.com/services/ # Slack Webhook URL
  NGINX_VERSION: "1.19.7" # Nginx default version
  PAGESPEED_VERSION: "1.13.35.2" # PageSpeed default version
  LIBPNG_VERSION: "1.6.37" # libpng default version