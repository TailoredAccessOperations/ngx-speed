##
# ngx_pagespeed config
##
# PageSpeed configurations
pagespeed on;
pagespeed Domain https://proxy.htp.sh;
pagespeed RewriteLevel CoreFilters;

# Filters
## Core filters
pagespeed EnableFilters add_head,combine_heads;

## Miscellaneous
pagespeed EnableFilters add_instrumentation,insert_dns_prefetch;

## Cache
pagespeed EnableFilters in_place_optimize_for_browser,hint_preload_subresources,extend_cache,extend_cache_pdfs,local_storage_cache;

## Text / HTML
pagespeed EnableFilters collapse_whitespace,convert_meta_tags,elide_attributes,pedantic,remove_comments,remove_quotes,trim_urls;

## JavaScript
pagespeed UseExperimentalJsMinifier on;
pagespeed EnableFilters rewrite_javascript,canonicalize_javascript_libraries,inline_javascript;

## CSS
pagespeed EnableFilters outline_css,combine_css,inline_import_to_link,inline_css,inline_google_font_css,move_css_above_scripts,move_css_to_head,prioritize_critical_css,rewrite_css,flatten_css_imports,fallback_rewrite_css_urls,rewrite_style_attributes_with_url;

## Images
pagespeed DisableFilters responsive_images;
pagespeed EnableFilters rewrite_images,recompress_images,dedup_inlined_images,inline_preview_images,resize_mobile_images,lazyload_images,inline_images,convert_gif_to_png,convert_jpeg_to_progressive,recompress_jpeg,recompress_png,recompress_webp,strip_image_color_profile,strip_image_meta_data,jpeg_subsampling,convert_png_to_jpeg,resize_images,resize_rendered_image_dimensions,convert_jpeg_to_webp,convert_to_webp_animated,convert_to_webp_lossless,insert_image_dimensions;
pagespeed NoTransformOptimizedImages on;
pagespeed EnableFilters sprite_images;

# Additional configurations from previous version
#pagespeed HonorCsp on;
pagespeed LowercaseHtmlNames on;
pagespeed RewriteLevel OptimizeForBandwidth;
pagespeed RespectVary off;
#pagespeed DisableRewriteOnNoTransform on;
#pagespeed ModifyCachingHeaders on;

#pagespeed AllowVaryOn "Auto";
#pagespeed EnableCachePurge on;
#pagespeed PurgeMethod PURGE;
#pagespeed SupportNoScriptEnabled false;
pagespeed InPlaceResourceOptimization on;

#pagespeed MaxCacheableContentLength -1;
#pagespeed FileCacheSizeKb 2304000;
#pagespeed FileCacheInodeLimit 5000000;
#pagespeed FileCacheCleanIntervalMs -1;

#pagespeed MaxCombinedJsBytes 999999999;
pagespeed CombineAcrossPaths on;
#pagespeed MaxSegmentLength 2048;

#pagespeed LRUCacheKbPerProcess 16384;
#pagespeed LRUCacheByteLimit 32768;

#pagespeed DownstreamCacheRewrittenPercentageThreshold 95;

pagespeed PreserveUrlRelativity on;
pagespeed RespectXForwardedProto on;